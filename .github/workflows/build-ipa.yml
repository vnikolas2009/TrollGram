name: Build and Release TrollGram IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "release_arm64"
        type: choice
        options:
          - release_arm64
      create_release:
        description: "Publish a GitHub Release with the IPA"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: /Users/Shared/trollgram-ios
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_trollgram

jobs:
  build:
    name: Build TrollGram.ipa
    runs-on: macos-13
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: "0"

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /Users/runner/Library/Developer/Xcode/DerivedData/* || true
          sudo rm -rf /Users/runner/Library/Caches/org.swift.swiftpm || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTV* || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/Watch* || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/DriverKit* || true
          df -h /

      - name: Select Xcode
        run: |
          set -x
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "Xcode ${XCODE_VERSION} not available, using default: $(xcodebuild -version | head -1)"
          fi
          xcodebuild -version

      - name: Fetch Python runtime
        run: |
          set -x
          python3 build-system/setup_python.py
          du -sh third-party/python/Python.xcframework build/python-ios

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo rm -rf "$SOURCE_DIR"
          sudo cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$SOURCE_DIR"

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            /Users/Shared/telegram-bazel-cache
            ${{ env.BAZEL_USER_ROOT }}
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Compute version
        run: |
          set -x
          cd "$SOURCE_DIR"
          OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((COMMIT_COUNT + OFFSET))" >> "$GITHUB_ENV"
          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          echo "CONFIGURATION=${{ github.event.inputs.configuration || 'release_arm64' }}" >> "$GITHUB_ENV"

      - name: Build app (unsigned)
        run: |
          set -x
          cd "$SOURCE_DIR"
          mkdir -p /Users/Shared/telegram-bazel-cache
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --configuration="$CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            --overrideXcodeVersion="$XCODE_VERSION" \
            --disableProvisioningProfiles \
            --bazelProfile="/Users/Shared/telegram-bazel-cache/profile.json"

      - name: Package unsigned IPA
        run: |
          set -x
          cd "$SOURCE_DIR"
          APP_DIR=$(find bazel-out -maxdepth 7 -type d \( -name "TrollGram.app" -o -name "Telegram.app" \) | grep -E "applebin_ios-ios_arm" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Built .app bundle not found" >&2
            find bazel-out -maxdepth 7 -type d -name "*.app" | head -20
            exit 1
          fi
          echo "Using $APP_DIR"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/TrollGram.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/TrollGram.app"
          rm -f "$RUNNER_TEMP/Payload/TrollGram.app/embedded.mobileprovision"
          cd "$RUNNER_TEMP"
          zip -qry TrollGram.ipa Payload
          echo "IPA_SIZE=$(du -h TrollGram.ipa | cut -f1)" >> "$GITHUB_ENV"
          ls -lh TrollGram.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/TrollGram.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Determine release tag
        id: release_meta
        run: |
          set -x
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$APP_VERSION-$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=${{ github.event.inputs.create_release || 'true' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        if: steps.release_meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="TrollGram $APP_VERSION ($BUILD_NUMBER)"
          NOTES="Unsigned TrollGram $APP_VERSION build $BUILD_NUMBER ($IPA_SIZE).

          Install with TrollStore or Sideloadly. No provisioning profile is embedded."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/TrollGram.ipa" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/TrollGram.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
