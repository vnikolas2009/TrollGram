name: Build and Release TrollGram IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "release_arm64"
        type: choice
        options:
          - release_arm64
      create_release:
        description: "Publish a GitHub Release with the IPA"
        required: false
        default: true
        type: boolean
      keep_going:
        description: "Keep going after a compile error (slower, but reports more errors per run)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
  # One-off off-peak run: Sat 2026-11-14 03:17 UTC (06:17 MSK, US night, weekend). Fires once per year on
  # Nov 14; inputs fall back to release_arm64 / keep_going=false / create_release=true. Remove after use.
  schedule:
    - cron: "17 3 14 11 *"

permissions:
  contents: write
  issues: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build straight from the checkout: an extra copy of the tree cost several
  # minutes per run and cache keys stay stable because the path is constant.
  SOURCE_DIR: ${{ github.workspace }}
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_trollgram
  BUILD_CACHE_DIR: /Users/Shared/trollgram-bazel-cache
  BUILD_LOG: /Users/Shared/trollgram-build.log

jobs:
  build:
    name: Build TrollGram.ipa
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}

    steps:
      - name: Checkout
        timeout-minutes: 20
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          # Shallow clones: the build number comes from the run number, and
          # full history of the main repo plus all submodules is the slowest
          # part of the setup.
          fetch-depth: "1"

      - name: Free disk space
        timeout-minutes: 20
        run: |
          set -x
          sudo rm -rf /Users/runner/Library/Developer/Xcode/DerivedData/* || true
          sudo rm -rf /Users/runner/Library/Caches/org.swift.swiftpm || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTV* || true
          # The watchOS platform is kept: the build produces a watch app, and
          # removing the SDK makes the build fail early.
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/DriverKit* || true
          df -h /

      - name: Select Xcode
        timeout-minutes: 10
        run: |
          set -x
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "Xcode ${XCODE_VERSION} not available, using default: $(xcodebuild -version | head -1)"
          fi
          xcodebuild -version

      - name: Fetch Python runtime
        timeout-minutes: 15
        run: |
          set -x
          python3 build-system/setup_python.py
          du -sh third-party/python/Python.xcframework third-party/python/resources

      - name: Prepare build log
        timeout-minutes: 5
        run: |
          set -x
          touch "$BUILD_LOG"

      # Only the action/repository cache is persisted: it is what makes a
      # re-run cheap. The Bazel output base is several extra GB and would push
      # the entry over the 10 GB per-repository cache limit.
      #
      # restore/save are separate steps so that a failed build still warms the
      # cache for the next attempt (actions/cache only saves on success).
      - name: Restore Bazel cache
        id: bazel-cache
        timeout-minutes: 30
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_CACHE_DIR }}
          key: bazel-v2-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'versions.json') }}-${{ github.run_id }}
          restore-keys: |
            bazel-v2-${{ runner.os }}-

      - name: Compute version
        timeout-minutes: 10
        run: |
          set -x
          cd "$SOURCE_DIR"
          OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + OFFSET))" >> "$GITHUB_ENV"
          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          echo "CONFIGURATION=${{ github.event.inputs.configuration || 'release_arm64' }}" >> "$GITHUB_ENV"

      - name: Build app (unsigned)
        timeout-minutes: 300
        run: |
          set -o pipefail
          set -x
          cd "$SOURCE_DIR"
          mkdir -p "$BUILD_CACHE_DIR"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          EXTRA_ARGS=(
            --skipDsym
            --enableParallelSwiftmoduleGeneration
            --bazelProfile="$RUNNER_TEMP/bazel-profile.json"
          )
          if [ "${{ github.event.inputs.keep_going }}" = "true" ]; then
            EXTRA_ARGS+=(--continueOnError)
          fi

          python3 -u build-system/Make/Make.py \
            --cacheDir="$BUILD_CACHE_DIR" \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration="$CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            "${EXTRA_ARGS[@]}" \
            2>&1 | tee -a "$BUILD_LOG"

      - name: Package unsigned IPA
        timeout-minutes: 20
        run: |
          set -x
          cd "$SOURCE_DIR"
          # Take the bundle from the .ipa that bazel just wrote (bazel-bin follows the last build's
          # configuration); the //Telegram:Swiftgram app target builds Swiftgram.ipa / Swiftgram.app.
          IPA_SRC=""
          for c in bazel-bin/Telegram/Swiftgram.ipa bazel-bin/Telegram/TrollGram.ipa bazel-bin/Telegram/Telegram.ipa; do
            if [ -f "$c" ]; then IPA_SRC="$c"; break; fi
          done
          if [ -z "$IPA_SRC" ]; then
            echo "Built .ipa not found in bazel-bin/Telegram" >&2
            ls -la bazel-bin/Telegram/*.ipa 2>&1 | head -20 >&2 || true
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa-extract"
          mkdir -p "$RUNNER_TEMP/ipa-extract"
          unzip -q -o "$IPA_SRC" -d "$RUNNER_TEMP/ipa-extract"
          APP_DIR=$(find "$RUNNER_TEMP/ipa-extract/Payload" -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app inside $IPA_SRC" >&2
            ls -la "$RUNNER_TEMP/ipa-extract/Payload" >&2 || true
            exit 1
          fi
          echo "Using $APP_DIR"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/TrollGram.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/TrollGram.app"
          rm -f "$RUNNER_TEMP/Payload/TrollGram.app/embedded.mobileprovision"

          # Python.framework is a dylib, so it has to live in Frameworks/.
          # rules_apple may already embed it; only copy when it is missing.
          PY_FRAMEWORK="$SOURCE_DIR/third-party/python/Python.xcframework/ios-arm64/Python.framework"
          if [ -d "$PY_FRAMEWORK" ] && [ ! -d "$RUNNER_TEMP/Payload/TrollGram.app/Frameworks/Python.framework" ]; then
            mkdir -p "$RUNNER_TEMP/Payload/TrollGram.app/Frameworks"
            cp -R "$PY_FRAMEWORK" "$RUNNER_TEMP/Payload/TrollGram.app/Frameworks/"
          fi

          # Verify the plugin stdlib actually made it into the bundle.
          if [ -f "$RUNNER_TEMP/Payload/TrollGram.app/python.zip" ]; then
            echo "python.zip bundled: $(du -h "$RUNNER_TEMP/Payload/TrollGram.app/python.zip" | cut -f1)"
          else
            echo "warning: python.zip is missing from the app bundle" >&2
          fi

          cd "$RUNNER_TEMP"
          zip -qry TrollGram.ipa Payload
          echo "IPA_SIZE=$(du -h TrollGram.ipa | cut -f1)" >> "$GITHUB_ENV"
          ls -lh TrollGram.ipa

      # Optional: sign the IPA with the certificate from the repository
      # secrets. Failures do not fail the build - the unsigned IPA is still
      # published (TrollStore installs it as is).
      - name: Sign IPA with personal certificate
        id: sign
        if: env.P12_BASE64 != '' && env.PROFILE_BASE64 != ''
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          set -x
          printf '%s' "$P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/profile.mobileprovision"
          python3 build-system/sign_ipa.py \
            --input "$RUNNER_TEMP/TrollGram.ipa" \
            --output "$RUNNER_TEMP/TrollGram-signed.ipa" \
            --p12 "$RUNNER_TEMP/cert.p12" \
            --password "$P12_PASSWORD" \
            --profile "$RUNNER_TEMP/profile.mobileprovision" \
            2>&1 | tee "$RUNNER_TEMP/sign.log"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Report signing failure
        if: steps.sign.outcome == 'failure'
        timeout-minutes: 5
        run: |
          if [ -f "$RUNNER_TEMP/sign.log" ]; then
            tail -n 40 "$RUNNER_TEMP/sign.log" | while IFS= read -r line; do
              echo "::error::sign: $(printf '%s' "$line" | cut -c1-900)"
            done
          else
            echo "::error::sign: the signing step failed before producing a log"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 20
        with:
          name: TrollGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/TrollGram*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Determine release tag
        id: release_meta
        timeout-minutes: 5
        run: |
          set -x
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$APP_VERSION-$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=${{ github.event.inputs.create_release || 'true' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        if: steps.release_meta.outputs.publish == 'true'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="TrollGram $APP_VERSION ($BUILD_NUMBER)"
          FILES=("$RUNNER_TEMP/TrollGram.ipa")
          SIGNED_NOTE=""
          if [ -f "$RUNNER_TEMP/TrollGram-signed.ipa" ]; then
            FILES+=("$RUNNER_TEMP/TrollGram-signed.ipa")
            SIGNED_NOTE="
          TrollGram-signed.ipa is signed with the repository certificate and a
          provisioning profile, use it for Sideloadly / AltStore."
          fi
          NOTES="TrollGram $APP_VERSION build $BUILD_NUMBER ($IPA_SIZE).

          TrollGram.ipa is unsigned: install it with TrollStore.
          No provisioning profile is embedded.${SIGNED_NOTE}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

      # Compiler errors are mirrored as check-run annotations, which stay
      # readable even when the raw job log download is blocked.
      - name: Surface build errors as annotations
        if: failure()
        timeout-minutes: 10
        run: |
          if [ ! -f "$BUILD_LOG" ]; then
            echo "::error::no build log at $BUILD_LOG"
            exit 0
          fi
          grep -a -E "error|Error|ERROR|fatal|FAILED|Traceback|Exception|not found|No such file|denied|Verification failure" "$BUILD_LOG" \
            | head -40 \
            | while IFS= read -r line; do
                echo "::error::$(printf '%s' "$line" | cut -c1-900)"
              done
          tail -n 25 "$BUILD_LOG" \
            | while IFS= read -r line; do
                echo "::error::tail: $(printf '%s' "$line" | cut -c1-900)"
              done
          echo "annotations emitted"

      # Artifact/log downloads are blocked on some networks, so the compiler
      # output is mirrored into an issue where the API can read it.
      - name: Publish build log on failure
        if: failure()
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$BUILD_LOG" ]; then
            echo "no build log at $BUILD_LOG"
            exit 0
          fi
          {
            echo "Build for \`$GITHUB_SHA\` (run \`$GITHUB_RUN_ID\`) failed."
            echo
            echo "### Errors"
            echo '```'
            grep -a -E "error:|ERROR:|error \[|FAILED:|fatal error" "$BUILD_LOG" | head -200 || true
            echo '```'
            echo
            echo "### Last 250 lines"
            echo '```'
            tail -n 250 "$BUILD_LOG"
            echo '```'
          } > /tmp/report.md
          head -c 60000 /tmp/report.md > /tmp/report-trimmed.md
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "CI build log in:title" --json number --jq '.[0].number // empty' || true)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "CI build log" --body-file /tmp/report-trimmed.md \
              || echo "::error::could not publish the build log to an issue"
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report-trimmed.md \
              || echo "::error::could not comment on the build log issue"
          fi

      # Persist the action/repository cache even when the build fails, so the
      # next attempt starts warm instead of recompiling everything.
      - name: Measure Bazel cache
        id: cache_size
        if: always()
        timeout-minutes: 10
        run: |
          SIZE_KB=$(du -sk "$BUILD_CACHE_DIR" 2>/dev/null | cut -f1)
          SIZE_KB=${SIZE_KB:-0}
          echo "Bazel cache: $((SIZE_KB / 1024)) MB"
          if [ "$SIZE_KB" -gt 8388608 ]; then
            echo "::warning::Bazel cache is larger than 8 GB - not uploaded to stay under the repository cache limit"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Bazel cache
        if: always() && steps.cache_size.outputs.ok == 'true' && steps.bazel-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_CACHE_DIR }}
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
