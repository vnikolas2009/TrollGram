name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "release_arm64"
        type: choice
        options:
          - release_arm64
          - release_arm32
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: /Users/Shared/trollgram-ios
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_trollgram

jobs:
  build:
    name: Build TrollGram.ipa
    runs-on: macos-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: "0"

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /Users/runner/Library/Developer/Xcode/DerivedData/* || true
          sudo rm -rf /Users/runner/Library/Caches/org.swift.swiftpm || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTV* || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/Watch* || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/DriverKit* || true
          df -h /

      - name: Select Xcode
        run: |
          set -x
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "Xcode ${XCODE_VERSION} not found on runner, keeping default $(xcodebuild -version | head -1)"
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo rm -rf "$SOURCE_DIR"
          sudo cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$SOURCE_DIR"

      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BAZEL_USER_ROOT }}
            /Users/Shared/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Compute build number
        run: |
          set -x
          cd "$SOURCE_DIR"
          OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((COMMIT_COUNT + OFFSET))" >> "$GITHUB_ENV"
          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          echo "CONFIGURATION=${{ github.event.inputs.configuration || 'release_arm64' }}" >> "$GITHUB_ENV"

      - name: Build app (unsigned)
        run: |
          set -x
          cd "$SOURCE_DIR"
          mkdir -p "$HOME/telegram-bazel-cache"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --configuration="$CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            --overrideXcodeVersion="$XCODE_VERSION" \
            --disableProvisioningProfiles \
            --bazelProfile="$HOME/telegram-bazel-cache/profile.json"

      - name: Package unsigned IPA
        run: |
          set -x
          cd "$SOURCE_DIR"
          APP_DIR=$(find bazel-out -maxdepth 7 -type d \( -name "TrollGram.app" -o -name "Telegram.app" \) | grep -E "applebin_ios-ios_arm" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Built .app bundle not found" >&2
            find bazel-out -maxdepth 7 -type d -name "*.app" | head -20
            exit 1
          fi
          echo "Using $APP_DIR"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/TrollGram.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/TrollGram.app"
          # strip any leftover embedded provisioning profile
          rm -f "$RUNNER_TEMP/Payload/TrollGram.app/embedded.mobileprovision"
          cd "$RUNNER_TEMP"
          zip -qry TrollGram.ipa Payload
          ls -lh TrollGram.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollGram-unsigned-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/TrollGram.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/TrollGram.ipa
          name: TrollGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned TrollGram ${{ env.APP_VERSION }} build ${{ env.BUILD_NUMBER }}.
            Install with TrollStore or Sideloadly.
          generate_release_notes: true
          fail_on_unmatched_files: true
