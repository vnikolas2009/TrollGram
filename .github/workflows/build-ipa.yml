name: Build and Release TrollGram IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "release_arm64"
        type: choice
        options:
          - release_arm64
      create_release:
        description: "Publish a GitHub Release with the IPA"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: /Users/Shared/trollgram-ios
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_trollgram
  BUILD_LOG: /Users/Shared/trollgram-build.log

jobs:
  build:
    name: Build TrollGram.ipa
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: "0"

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /Users/runner/Library/Developer/Xcode/DerivedData/* || true
          sudo rm -rf /Users/runner/Library/Caches/org.swift.swiftpm || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTV* || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/Watch* || true
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/DriverKit* || true
          df -h /

      - name: Select Xcode
        run: |
          set -x
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "Xcode ${XCODE_VERSION} not available, using default: $(xcodebuild -version | head -1)"
          fi
          xcodebuild -version

      - name: Fetch Python runtime
        run: |
          set -x
          python3 build-system/setup_python.py
          du -sh third-party/python/Python.xcframework third-party/python/resources

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo rm -rf "$SOURCE_DIR"
          sudo cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$SOURCE_DIR"
          touch "$BUILD_LOG"
          sudo chown "$(id -u):$(id -g)" "$BUILD_LOG"

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            /Users/Shared/telegram-bazel-cache
            ${{ env.BAZEL_USER_ROOT }}
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Compute version
        run: |
          set -x
          cd "$SOURCE_DIR"
          OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((COMMIT_COUNT + OFFSET))" >> "$GITHUB_ENV"
          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          echo "CONFIGURATION=${{ github.event.inputs.configuration || 'release_arm64' }}" >> "$GITHUB_ENV"

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          set -x
          cd "$SOURCE_DIR"
          mkdir -p /Users/Shared/telegram-bazel-cache
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --xcodeManagedCodesigning \
            --configuration="$CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            --overrideXcodeVersion="$XCODE_VERSION" \
            --disableProvisioningProfiles \
            --bazelProfile="/Users/Shared/telegram-bazel-cache/profile.json" \
            2>&1 | tee -a "$BUILD_LOG"

      - name: Package unsigned IPA
        run: |
          set -x
          cd "$SOURCE_DIR"
          APP_DIR=$(find bazel-out -maxdepth 8 -type d \( -name "TrollGram.app" -o -name "Telegram.app" \) | grep -E "applebin_ios-ios_arm" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Built .app bundle not found" >&2
            find bazel-out -maxdepth 8 -type d -name "*.app" | head -20
            exit 1
          fi
          echo "Using $APP_DIR"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/TrollGram.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/TrollGram.app"
          rm -f "$RUNNER_TEMP/Payload/TrollGram.app/embedded.mobileprovision"

          # Python.framework is a dylib, so it has to live in Frameworks/.
          # rules_apple may already embed it; only copy when it is missing.
          PY_FRAMEWORK="$SOURCE_DIR/third-party/python/Python.xcframework/ios-arm64/Python.framework"
          if [ -d "$PY_FRAMEWORK" ] && [ ! -d "$RUNNER_TEMP/Payload/TrollGram.app/Frameworks/Python.framework" ]; then
            mkdir -p "$RUNNER_TEMP/Payload/TrollGram.app/Frameworks"
            cp -R "$PY_FRAMEWORK" "$RUNNER_TEMP/Payload/TrollGram.app/Frameworks/"
          fi

          # Verify the plugin stdlib actually made it into the bundle.
          if [ -f "$RUNNER_TEMP/Payload/TrollGram.app/python.zip" ]; then
            echo "python.zip bundled: $(du -h "$RUNNER_TEMP/Payload/TrollGram.app/python.zip" | cut -f1)"
          else
            echo "warning: python.zip is missing from the app bundle" >&2
          fi

          cd "$RUNNER_TEMP"
          zip -qry TrollGram.ipa Payload
          echo "IPA_SIZE=$(du -h TrollGram.ipa | cut -f1)" >> "$GITHUB_ENV"
          ls -lh TrollGram.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/TrollGram.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Determine release tag
        id: release_meta
        run: |
          set -x
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$APP_VERSION-$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=${{ github.event.inputs.create_release || 'true' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        if: steps.release_meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="TrollGram $APP_VERSION ($BUILD_NUMBER)"
          NOTES="Unsigned TrollGram $APP_VERSION build $BUILD_NUMBER ($IPA_SIZE).

          Install with TrollStore or Sideloadly. No provisioning profile is embedded."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/TrollGram.ipa" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/TrollGram.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

      # Compiler errors are mirrored as check-run annotations, which stay
      # readable even when the raw job log download is blocked.
      - name: Surface build errors as annotations
        if: failure()
        run: |
          if [ ! -f "$BUILD_LOG" ]; then
            echo "no build log at $BUILD_LOG"
            exit 0
          fi
          grep -a -E "error:|error \[|ERROR:|fatal error|FAILED:" "$BUILD_LOG" \
            | head -40 \
            | while IFS= read -r line; do
                echo "::error::$(printf '%s' "$line" | cut -c1-900)"
              done
          echo "annotations emitted"

      # Artifact/log downloads are blocked on some networks, so the compiler
      # output is mirrored into an issue where the API can read it.
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$BUILD_LOG" ]; then
            echo "no build log at $BUILD_LOG"
            exit 0
          fi
          {
            echo "Build for \`$GITHUB_SHA\` (run \`$GITHUB_RUN_ID\`) failed."
            echo
            echo "### Errors"
            echo '```'
            grep -a -E "error:|ERROR:|error \[|FAILED:|fatal error" "$BUILD_LOG" | head -200 || true
            echo '```'
            echo
            echo "### Last 250 lines"
            echo '```'
            tail -n 250 "$BUILD_LOG"
            echo '```'
          } > /tmp/report.md
          head -c 60000 /tmp/report.md > /tmp/report-trimmed.md
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "CI build log in:title" --json number --jq '.[0].number // empty' || true)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "CI build log" --body-file /tmp/report-trimmed.md || true
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report-trimmed.md || true
          fi
